database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  pool_size: 5
  max_overflow: 10
  stock_batch_size: 500
  sql_chunk_size: 250000

data:
  start_date: "2019-01-01"
  end_date: null
  max_stocks: null
  min_history_rows: 250
  raw_dir: "data/raw"
  processed_dir: "data/processed"

target:
  horizon: 7
  allowed_horizons: [1, 3, 5, 7, 10]

features:
  lookback: 20
  lags: [1, 2, 3, 5, 10, 20]
  lag_columns:
    - rsi
    - macd
    - macd_hist
    - atr
    - bollinger_position
    - bollinger_width
    - ema_difference
    - return_1d
    - return_5d
    - volume_ratio

training:
  target_horizon: 7
  lookback: 20
  training_years: 3
  years: 3
  allowed_training_years: [1, 2, 3, 5]
  random_seed: 42
  train_end: "2023-12-31"
  val_end: "2024-12-31"

validation:
  method: walk_forward
  folds:
    - name: "Fold_1"
      train_start: "2019-01-01"
      train_end: "2022-12-31"
      val_start: "2023-01-01"
      val_end: "2023-12-31"
    - name: "Fold_2"
      train_start: "2019-01-01"
      train_end: "2023-12-31"
      val_start: "2024-01-01"
      val_end: "2024-12-31"
    - name: "Fold_3"
      train_start: "2019-01-01"
      train_end: "2024-12-31"
      val_start: "2025-01-01"
      val_end: "2025-12-31"
  test_period:
    train_start: "2019-01-01"
    train_end: "2025-12-31"
    test_start: "2026-01-01"
    test_end: "2026-12-31"

model:
  type: ridge
  alpha: 1.0

models:
  - dummy
  - linear_regression
  - ridge
  - elastic_net
  - xgboost
  - lightgbm

tuning:
  ridge:
    alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
  elastic_net:
    alpha: [0.001, 0.01]
    l1_ratio: [0.5]
  xgboost:
    max_depth: [3, 5]
    learning_rate: [0.05]
    n_estimators: [100]
    subsample: [0.8]
    colsample_bytree: [0.8]
  lightgbm:
    max_depth: [3, 5]
    learning_rate: [0.05]
    n_estimators: [100]
    subsample: [0.8]
    colsample_bytree: [0.8]

metrics:
  - mae
  - rmse
  - r2
  - direction_accuracy
  - pearson
  - spearman
